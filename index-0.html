<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="https://cl2.dcode.unilever.com/ngui/asset/images/dcode-logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO tags -->
    <title>DDT & DCODE Docs</title>
    <meta
      name="description"
      content="DDT & DCODE Docs — digitized distributor transformation documentation, guides, and reference for order booking, stock allocation, deposit slips, and delivery workflows."
    />
    <link rel="canonical" href="https://your-domain.example.com/" />

    <!-- Open Graph (Facebook, LinkedIn, WhatsApp, Slack previews) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DDT & DCODE Docs" />
    <meta property="og:title" content="DDT & DCODE Docs" />
    <meta
      property="og:description"
      content="Digitized distributor transformation documentation, guides, and reference for order booking, stock allocation, deposit slips, and delivery workflows."
    />
    <meta property="og:image" content="https://cl2.dcode.unilever.com/ngui/asset/images/dcode-logo.svg" />
    <meta property="og:url" content="https://your-domain.example.com/" />

    <!-- Twitter card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="DDT & DCODE Docs" />
    <meta
      name="twitter:description"
      content="Digitized distributor transformation documentation, guides, and reference for order booking, stock allocation, deposit slips, and delivery workflows."
    />
    <meta name="twitter:image" content="https://cl2.dcode.unilever.com/ngui/asset/images/dcode-logo.svg" />

    <!-- Allow indexing (remove/change if any section should stay private) -->
    <meta name="robots" content="index, follow" />

    <link href="/src/App.css" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <!--
      NOTE: Do NOT manually add a <script> block for /@react-refresh here.
      Vite's @vitejs/plugin-react injects that preamble automatically at
      dev-server request time, before this main.jsx script runs. Hand-adding
      it (especially after this line) breaks Fast Refresh with the error
      "@vitejs/plugin-react can't detect preamble."
    -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
